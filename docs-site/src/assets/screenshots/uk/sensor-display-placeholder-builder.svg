<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" role="img" aria-labelledby="title desc"><title id="title">Конструктор placeholder з температурою води</title><desc id="desc">Вибрано метрику температури води, нижче показані згенерований placeholder і живе значення.</desc><style>text{font-family:system-ui,sans-serif;fill:#334155}.h{font-size:16px;font-weight:700}.l{font-size:12px;fill:#64748b}.v{font-size:17px}.m{font-family:ui-monospace,SFMono-Regular,monospace;font-size:15px}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:4}</style><rect width="720" height="272" fill="#fff"/><text class="h" x="14" y="28">Конструктор placeholder</text><rect x="488" y="12" width="218" height="28" rx="4" fill="#ecfdf5"/><text x="500" y="31" font-size="13" fill="#15803d">Вибрана метрика доступна.</text><text class="l" x="16" y="61">Простір імен</text><text class="l" x="370" y="61">Пристрій</text><rect class="box" x="14" y="66" width="338" height="40"/><rect class="box" x="368" y="66" width="338" height="40"/><text class="v" x="28" y="92">Пристрої</text><text class="v" x="382" y="92">Температура води</text><text class="l" x="16" y="125">Метрика</text><text class="l" x="370" y="125">Фільтр</text><rect class="box" x="14" y="130" width="338" height="40"/><rect class="box" x="368" y="130" width="294" height="40"/><text class="v" x="28" y="156">Температура води</text><text class="v" x="382" y="156">Без фільтра</text><text class="l" x="16" y="189">Згенерований placeholder</text><rect class="box" x="14" y="194" width="692" height="40"/><text class="m" x="28" y="220">{{dev.670845752.temperature}}</text><text class="l" x="16" y="253">Попередній перегляд значення</text><text class="v" x="238" y="253">24.63 °C</text></svg>
