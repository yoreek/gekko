<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">Générateur de placeholders de température</title><desc id="desc">Le concepteur d’écran sélectionne Température de l’eau et sa métrique de température, affiche le placeholder généré et un aperçu avec une valeur en direct.</desc><style>text{font-family:system-ui,sans-serif;fill:#334155}.heading{font-size:19px;font-weight:700}.caption{font-size:13px;fill:#64748b}.value{font-size:16px}.field{fill:#fff;stroke:#94a3b8;stroke-width:1.7;rx:5}.screen{fill:#172033;stroke:#475569;stroke-width:2;rx:10}</style><rect width="820" height="360" rx="14" fill="#f8fafc"/><rect x="18" y="18" width="784" height="324" rx="11" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="heading" x="44" y="57">Générateur de placeholders</text><text class="caption" x="44" y="90">Appareil</text><rect class="field" x="44" y="100" width="390" height="48"/><text class="value" x="62" y="131">Température de l’eau</text><path d="M402 119l8 8 8-8" fill="none" stroke="#475569" stroke-width="2"/><text class="caption" x="44" y="180">Métrique</text><rect class="field" x="44" y="190" width="390" height="48"/><text class="value" x="62" y="221">température</text><text class="caption" x="44" y="270">Placeholder généré</text><rect x="44" y="280" width="490" height="40" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.7"/><text x="59" y="306" font-family="ui-monospace,monospace" font-size="15" fill="#1d4ed8">{{dev.670845752.temperature}}</text><rect class="screen" x="578" y="96" width="182" height="178"/><text x="601" y="129" font-size="13" fill="#94a3b8">Aperçu</text><text x="601" y="167" font-family="ui-monospace,monospace" font-size="14" fill="#67e8f9">EAU</text><text x="601" y="221" font-family="ui-monospace,monospace" font-size="30" font-weight="700" fill="#e0faff">24.63 °C</text><text class="caption" x="596" y="302">Valeur en direct</text></svg>
