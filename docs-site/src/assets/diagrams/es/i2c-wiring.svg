<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t d"><title id="t">I2C: dos líneas y direcciones de dispositivos</title><desc id="d">Un ESP32 conecta un OLED SSD1306 y otros dispositivos al bus I2C compartido mediante SDA y SCL.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.title{font-size:19px;font-weight:700}.label{font-size:14px;font-weight:650}.note{font-size:13px}.card{fill:#fff;stroke:#475569;stroke-width:2.5;rx:10}</style><rect x="1" y="1" width="918" height="398" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text class="title" x="35" y="42">I2C: dos líneas, cada dispositivo tiene una dirección</text><rect x="50" y="90" width="150" height="140" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/><text x="125" y="120" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">ESP32</text><text x="186" y="160" font-size="13.5" fill="#e2e8f0" text-anchor="end">SDA 21</text><text x="186" y="205" font-size="13.5" fill="#e2e8f0" text-anchor="end">SCL 22</text><text x="125" y="255" text-anchor="middle" class="label">Controlador Gekko</text><text x="125" y="274" text-anchor="middle" class="note" fill="#64748b">dispositivo i2c_bus</text><line x1="200" y1="155" x2="870" y2="155" stroke="#f59e0b" stroke-width="4"/><line x1="200" y1="200" x2="870" y2="200" stroke="#3b82f6" stroke-width="4"/><text x="866" y="143" class="note" fill="#b45309" text-anchor="end">SDA (datos)</text><text x="866" y="222" class="note" fill="#1d4ed8" text-anchor="end">SCL (reloj)</text><path d="M250 155v-35l6-5-12-7 12-7-12-7 12-7-6-5V74M286 200v-80l6-5-12-7 12-7-12-7 12-7-6-5V74" fill="none" stroke="#64748b" stroke-width="2.6"/><text x="304" y="80" class="label" fill="#dc2626">3.3 V</text><text x="304" y="98" class="note" fill="#64748b">Pull-ups (a menudo en el módulo)</text><g><line x1="390" y1="155" x2="390" y2="252" stroke="#f59e0b" stroke-width="3"/><line x1="414" y1="200" x2="414" y2="252" stroke="#3b82f6" stroke-width="3"/><rect class="card" x="350" y="252" width="110" height="66"/><rect x="362" y="264" width="86" height="26" rx="3" fill="#0f172a"/><text x="405" y="282" font-family="ui-monospace,monospace" font-size="11" fill="#67e8f9" text-anchor="middle">24.7°C</text><text x="405" y="308" class="label" text-anchor="middle">SSD1306</text><text x="405" y="337" class="note" fill="#0369a1" text-anchor="middle">0x3C</text></g><g><line x1="560" y1="155" x2="560" y2="252" stroke="#f59e0b" stroke-width="3"/><line x1="584" y1="200" x2="584" y2="252" stroke="#3b82f6" stroke-width="3"/><rect class="card" x="520" y="252" width="110" height="66"/><text x="575" y="292" class="label" text-anchor="middle">HTU21</text><text x="575" y="337" class="note" fill="#0369a1" text-anchor="middle">0x40</text></g><g><line x1="730" y1="155" x2="730" y2="252" stroke="#f59e0b" stroke-width="3"/><line x1="754" y1="200" x2="754" y2="252" stroke="#3b82f6" stroke-width="3"/><rect class="card" x="690" y="252" width="110" height="66"/><text x="745" y="292" class="label" text-anchor="middle">DS3231</text><text x="745" y="337" class="note" fill="#0369a1" text-anchor="middle">0x68</text></g><text x="35" y="382" class="label" fill="#475569">Todos comparten dos líneas; la dirección de 7 bits de cada transacción indica quién debe responder.</text></svg>
