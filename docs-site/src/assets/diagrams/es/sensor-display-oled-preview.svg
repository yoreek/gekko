<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><title id="title">Placeholder resuelto en una pantalla SSD1306</title><desc id="desc">Un widget de texto con un placeholder de temperatura se resuelve en el valor 24,6 grados Celsius en la vista previa OLED.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.heading{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:13px;fill:#475569}.mono{font-family:ui-monospace,monospace;font-size:14px}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7c3aed"/></marker></defs><rect class="panel" x="28" y="58" width="365" height="206"/><text class="heading" x="54" y="95">Widget de texto</text><text class="small" x="54" y="126">Placeholder</text><rect x="54" y="139" width="313" height="53" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="mono" x="70" y="170">{{dev.&lt;sensor-id&gt;.temperature}}</text><text class="small" x="54" y="225">Métrica de Temperatura del agua</text><path d="M405 164h96" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/><text class="label" x="416" y="142" fill="#6d28d9">se resuelve en</text><rect x="532" y="30" width="350" height="265" rx="18" fill="#334155"/><rect x="554" y="56" width="306" height="213" rx="7" fill="#020617"/><text x="582" y="105" font-family="ui-monospace,monospace" font-size="18" fill="#67e8f9">HABITACIÓN</text><text x="582" y="186" font-family="ui-monospace,monospace" font-size="55" font-weight="700" fill="#e0faff">24.6 °C</text><text x="582" y="230" font-family="ui-monospace,monospace" font-size="15" fill="#22d3ee">Temperatura del agua</text><text class="heading" x="612" y="321">Vista previa SSD1306</text></svg>
