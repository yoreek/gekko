<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc"><title id="title">Dependencias y flujo de datos del monitor de temperatura</title><desc id="desc">Un bus 1-Wire proporciona un sensor DS18B20 que publica la lectura actual y el historial.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.label{font-size:17px;font-weight:600}.note{font-size:14px}.node{fill:#fff;stroke:#475569;stroke-width:2;rx:9}.dep{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.flow{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="context-stroke"/></marker></defs><rect class="node" x="30" y="85" width="150" height="55"/><text class="label" x="58" y="118">Bus 1-Wire</text><rect class="node" x="305" y="85" width="160" height="55"/><text class="label" x="338" y="118">DS18B20</text><rect class="node" x="610" y="35" width="160" height="50"/><text class="label" x="629" y="66">Lectura actual</text><rect class="node" x="610" y="140" width="160" height="50"/><text class="label" x="652" y="171">Historial</text><path class="dep" d="M180 112h125"/><text class="note" x="205" y="95">depende de</text><path class="flow" d="M465 100h75v-40h70"/><path class="flow" d="M465 125h75v40h70"/><text class="note" x="482" y="173">publica lectura</text></svg>
