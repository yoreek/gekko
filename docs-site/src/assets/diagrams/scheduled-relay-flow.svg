<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" role="img" aria-labelledby="title desc"><title id="title">Scheduled relay dependencies and control flow</title><desc id="desc">A reliable clock validates a schedule. The schedule conditions an Auto Switch, which drives a GPIO relay and load.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.label{font-size:16px;font-weight:650}.note{font-size:13px}.node{fill:#fff;stroke:#475569;stroke-width:2;rx:9}.dep{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.flow{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="context-stroke"/></marker></defs><rect class="node" x="30" y="105" width="145" height="56"/><text class="label" x="72" y="138">Clock</text><rect class="node" x="260" y="105" width="145" height="56"/><text class="label" x="304" y="138">Schedule</text><rect class="node" x="490" y="105" width="145" height="56"/><text class="label" x="520" y="138">Auto Switch</text><rect class="node" x="720" y="45" width="145" height="56"/><text class="label" x="754" y="78">GPIO relay</text><rect class="node" x="720" y="170" width="145" height="56"/><text class="label" x="770" y="203">Load</text><path class="dep" d="M175 133h85"/><text class="note" x="188" y="116">validates</text><path class="dep" d="M405 133h85"/><text class="note" x="424" y="116">condition</text><path class="flow" d="M635 120h42V73h43"/><text class="note" x="653" y="100">drives</text><path class="flow" d="M792 101v69"/><text class="note" x="802" y="142">switches</text><text class="note" x="30" y="255">Dashed arrow: dependency · Red arrow: control or power path</text></svg>
