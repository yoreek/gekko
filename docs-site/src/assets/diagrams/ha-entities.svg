<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="918" height="418" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="35" y="42" font-size="19" font-weight="700" fill="#0f172a">What shows up in Home Assistant</text>

  <!-- Gekko side -->
  <g>
    <rect x="50" y="90" width="200" height="250" rx="12" fill="#0f172a"/>
    <text x="150" y="126" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Gekko</text>
    <g font-size="13" fill="#94a3b8" text-anchor="middle">
      <text x="150" y="156">GPIO Relay</text>
      <text x="150" y="180">Water Temperature</text>
      <text x="150" y="204">Room Climate (HTU21)</text>
      <text x="150" y="228">Grow Room Thermostat</text>
      <text x="150" y="252">Leak Sensor</text>
    </g>
    <rect x="76" y="278" width="148" height="30" rx="15" fill="#14532d"/>
    <text x="150" y="298" font-size="12.5" fill="#86efac" text-anchor="middle">Publish to HA ✓</text>
  </g>

  <!-- arrow -->
  <path d="M250 215 H 320" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 207 l 16 8 -16 8 z" fill="#94a3b8"/>
  <text x="295" y="196" font-size="12.5" fill="#64748b" text-anchor="middle">MQTT</text>
  <text x="295" y="243" font-size="12.5" fill="#64748b" text-anchor="middle">discovery</text>

  <!-- HA device card (schematic) -->
  <g>
    <rect x="350" y="70" width="520" height="310" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="378" y="106" font-size="16" font-weight="700" fill="#0f172a">Gekko controller</text>
    <text x="378" y="127" font-size="12.5" fill="#64748b">added automatically via MQTT discovery — no YAML</text>

    <!-- switch row -->
    <g>
      <circle cx="396" cy="160" r="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <path d="M396 154 v 6 M392 156 a 6 6 0 1 0 8 0" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="420" y="158" font-size="14" fill="#0f172a">GPIO Relay</text>
      <text x="420" y="174" font-size="11.5" fill="#94a3b8">switch — toggle it right from HA</text>
      <rect x="782" y="148" width="46" height="24" rx="12" fill="#3b82f6"/>
      <circle cx="816" cy="160" r="9" fill="#ffffff"/>
    </g>
    <line x1="378" y1="190" x2="842" y2="190" stroke="#f1f5f9" stroke-width="2"/>

    <!-- temperature sensor row -->
    <g>
      <circle cx="396" cy="212" r="11" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <rect x="393.5" y="205" width="5" height="9" rx="2.5" fill="#f97316"/>
      <circle cx="396" cy="217" r="3.4" fill="#f97316"/>
      <text x="420" y="210" font-size="14" fill="#0f172a">Water Temperature</text>
      <text x="420" y="226" font-size="11.5" fill="#94a3b8">sensor — history, automations, alerts</text>
      <text x="842" y="218" font-size="14" font-weight="600" fill="#0f172a" text-anchor="end">24.7 °C</text>
    </g>
    <line x1="378" y1="242" x2="842" y2="242" stroke="#f1f5f9" stroke-width="2"/>

    <!-- humidity row -->
    <g>
      <circle cx="396" cy="264" r="11" fill="#eff6ff" stroke="#0ea5e9" stroke-width="2"/>
      <path d="M396 257 C 400 262 401.5 264.5 401.5 266.5 a 5.5 5.5 0 1 1 -11 0 c 0 -2 1.5 -4.5 5.5 -9.5 z" fill="#0ea5e9"/>
      <text x="420" y="262" font-size="14" fill="#0f172a">Room Humidity</text>
      <text x="420" y="278" font-size="11.5" fill="#94a3b8">second sensor from the same HTU21 device</text>
      <text x="842" y="270" font-size="14" font-weight="600" fill="#0f172a" text-anchor="end">45.2 %</text>
    </g>
    <line x1="378" y1="294" x2="842" y2="294" stroke="#f1f5f9" stroke-width="2"/>

    <!-- climate row -->
    <g>
      <circle cx="396" cy="318" r="11" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <path d="M391 322 a 6 6 0 0 1 10 -4 M401 314 a 6 6 0 0 1 -10 4" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="420" y="316" font-size="14" fill="#0f172a">Grow Room Thermostat</text>
      <text x="420" y="332" font-size="11.5" fill="#94a3b8">climate — mode and setpoint editable from HA</text>
      <text x="842" y="312" font-size="14" font-weight="600" fill="#b91c1c" text-anchor="end">Heat · 25.0 °C</text>
      <text x="842" y="330" font-size="11.5" fill="#94a3b8" text-anchor="end">currently 24.7 °C</text>
    </g>
  </g>

  <text x="35" y="404" font-size="14" fill="#475569">Schematic view — entity names, icons, and values come through discovery; changes flow both ways in real time.</text>
</svg>
