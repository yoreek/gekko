<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="918" height="428" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="35" y="42" font-size="19" font-weight="700" fill="#0f172a">One bus, one pin — many probes</text>

  <!-- ESP32 -->
  <g>
    <rect x="50" y="120" width="140" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="70" y="138" width="52" height="54" rx="4" fill="#334155"/>
    <text x="152" y="172" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">ESP32</text>
    <text x="120" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Gekko controller</text>
    <text x="120" y="257" text-anchor="middle" font-size="13" fill="#64748b">onewire_bus on GPIO 4</text>
  </g>

  <!-- data line -->
  <line x1="190" y1="165" x2="820" y2="165" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="800" y="150" font-size="13" fill="#64748b" text-anchor="end">DATA</text>

  <!-- pull-up resistor to 3.3V -->
  <g>
    <line x1="250" y1="165" x2="250" y2="128" stroke="#475569" stroke-width="3"/>
    <path d="M250 128 l 7 -6 l -14 -8 l 14 -8 l -14 -8 l 14 -8 l -7 -6" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
    <line x1="250" y1="84" x2="250" y2="72" stroke="#475569" stroke-width="3"/>
    <text x="268" y="106" font-size="13" fill="#b45309">4.7 kΩ</text>
    <text x="238" y="64" font-size="13" fill="#dc2626" font-weight="600">3.3 V</text>
  </g>

  <!-- probes: cable down + steel tip -->
  <!-- probe template drawn inline 3 times -->
  <g>
    <path d="M370 165 C 370 200 370 210 370 235" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="358" y="235" width="24" height="58" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>
    <text x="370" y="316" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Tank</text>
    <text x="370" y="334" text-anchor="middle" font-size="12" fill="#64748b">28FF641D…03AD</text>
  </g>
  <g>
    <path d="M540 165 C 540 200 540 210 540 235" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="528" y="235" width="24" height="58" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>
    <text x="540" y="316" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Sump</text>
    <text x="540" y="334" text-anchor="middle" font-size="12" fill="#64748b">28A2C41F…9B01</text>
  </g>
  <g>
    <path d="M710 165 C 710 200 710 210 710 235" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="698" y="235" width="24" height="58" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>
    <text x="710" y="316" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Room air</text>
    <text x="710" y="334" text-anchor="middle" font-size="12" fill="#64748b">2809E33A…4C77</text>
  </g>

  <!-- water hint under tank probe -->
  <path d="M340 300 q 15 -8 30 0 q 15 8 30 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <text x="50" y="382" font-size="14" fill="#475569">Every DS18B20 has a unique 64-bit ROM address burned in at the factory (family code 28) —</text>
  <text x="50" y="402" font-size="14" fill="#475569">that's how many probes share one wire, and how the bus scan tells them apart.</text>
</svg>
