<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="918" height="468" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Aquarium -->
  <g>
    <rect x="650" y="150" width="240" height="270" rx="6" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="656" y="200" width="228" height="214" rx="4" fill="#bae6fd" opacity="0.75"/>
    <path d="M656 200 q 28 -8 57 0 q 29 8 57 0 q 29 -8 57 0 q 29 8 57 0 v 8 h -228 z" fill="#7dd3fc" opacity="0.8"/>
    <!-- fish -->
    <g fill="#0369a1" opacity="0.85">
      <path d="M710 300 q 18 -12 36 0 q -18 12 -36 0 z"/>
      <path d="M746 300 l 12 -8 v 16 z"/>
      <circle cx="718" cy="298" r="1.8" fill="#f8fafc"/>
    </g>
    <g fill="#0369a1" opacity="0.7">
      <path d="M800 350 q 15 -10 30 0 q -15 10 -30 0 z"/>
      <path d="M830 350 l 10 -7 v 14 z"/>
    </g>
    <!-- plant -->
    <path d="M672 414 q -4 -40 8 -58 M680 414 q 2 -34 16 -46 M690 414 q -2 -26 -14 -36" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <text x="770" y="446" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Aquarium</text>
  </g>

  <!-- Container -->
  <g>
    <rect x="80" y="196" width="130" height="210" rx="10" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="86" y="266" width="118" height="134" rx="6" fill="#bef264" opacity="0.75"/>
    <rect x="120" y="168" width="50" height="30" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="145" y="440" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Behälter</text>

    <!-- float level sensor -->
    <line x1="110" y1="196" x2="110" y2="330" stroke="#475569" stroke-width="3"/>
    <circle cx="110" cy="340" r="11" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <text x="30" y="352" font-size="14" fill="#64748b">Füllstands-</text>
    <text x="22" y="369" font-size="14" fill="#64748b">sensor</text>
  </g>

  <!-- Peristaltic pump -->
  <g>
    <rect x="380" y="180" width="120" height="46" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="440" cy="130" r="46" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <circle cx="440" cy="130" r="27" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="440" cy="103" r="9" fill="#94a3b8"/>
    <circle cx="417" cy="144" r="9" fill="#94a3b8"/>
    <circle cx="463" cy="144" r="9" fill="#94a3b8"/>
    <circle cx="440" cy="130" r="5" fill="#475569"/>
    <text x="440" y="252" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Peristaltikpumpe</text>
  </g>

  <!-- Tubing: container -> pump -> aquarium -->
  <path d="M145 168 C 145 88, 396 96, 398 108" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M482 108 C 560 70, 700 90, 726 148" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- drop into tank -->
  <path d="M726 168 C 731 176 734 181 734 185 a 8 8 0 1 1 -16 0 c 0 -4 3 -9 8 -17 z" fill="#38bdf8"/>
  <!-- flow arrows -->
  <g fill="#0284c7">
    <path d="M262 90 l 20 7 -20 7 5 -7 z"/>
    <path d="M596 76 l 20 6 -20 8 5 -7 z"/>
  </g>
  <text x="262" y="76" font-size="14" fill="#64748b">Dosierschlauch</text>

  <!-- Relay -->
  <g>
    <rect x="300" y="330" width="110" height="66" rx="8" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="314" y="344" width="36" height="38" rx="4" fill="#60a5fa" opacity="0.8"/>
    <circle cx="374" cy="352" r="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="374" cy="374" r="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="355" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Relais</text>
    <text x="355" y="438" text-anchor="middle" font-size="13" fill="#64748b">gpio_switch</text>
  </g>

  <!-- ESP32 -->
  <g>
    <rect x="470" y="318" width="150" height="92" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="492" y="336" width="58" height="56" rx="4" fill="#334155"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="470" y1="332" x2="458" y2="332"/><line x1="470" y1="350" x2="458" y2="350"/>
      <line x1="470" y1="368" x2="458" y2="368"/><line x1="470" y1="386" x2="458" y2="386"/>
      <line x1="620" y1="332" x2="632" y2="332"/><line x1="620" y1="350" x2="632" y2="350"/>
      <line x1="620" y1="368" x2="632" y2="368"/><line x1="620" y1="386" x2="632" y2="386"/>
    </g>
    <text x="586" y="372" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">ESP32</text>
    <text x="545" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Gekko-Controller</text>
  </g>

  <!-- Wires -->
  <!-- ESP32 -> relay -->
  <path d="M458 350 H 410" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <!-- relay -> pump motor -->
  <path d="M355 330 V 226" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <!-- float sensor -> ESP32 -->
  <path d="M145 160 C 145 140 240 128 262 260 C 274 330 380 300 458 386" fill="none" stroke="#22c55e" stroke-width="3.5" opacity="0.9"/>

  <text x="35" y="46" font-size="19" font-weight="700" fill="#0f172a">Anschluss der Dosierpumpe</text>
</svg>
