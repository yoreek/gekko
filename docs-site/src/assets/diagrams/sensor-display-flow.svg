<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Sensor display dependencies and data flow</title><desc id="desc">A 1-Wire bus provides a DS18B20 temperature sensor. An I2C bus provides an SSD1306 display. The display layout uses the sensor metric.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.label{font-size:16px;font-weight:650}.note{font-size:13px}.node{fill:#fff;stroke:#475569;stroke-width:2;rx:9}.dep{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.flow{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="context-stroke"/></marker></defs><rect class="node" x="35" y="70" width="150" height="55"/><text class="label" x="62" y="103">1-Wire bus</text><rect class="node" x="280" y="70" width="155" height="55"/><text class="label" x="310" y="103">DS18B20</text><rect class="node" x="35" y="210" width="150" height="55"/><text class="label" x="78" y="243">I2C bus</text><rect class="node" x="280" y="210" width="155" height="55"/><text class="label" x="307" y="243">SSD1306</text><rect class="node" x="560" y="140" width="160" height="55"/><text class="label" x="596" y="173">OLED layout</text><rect class="node" x="800" y="140" width="125" height="55"/><text class="label" x="832" y="173">Screen</text><path class="dep" d="M185 97h95"/><text class="note" x="204" y="80">provides</text><path class="dep" d="M185 237h95"/><text class="note" x="204" y="220">provides</text><path class="dep" d="M435 237h55v-69h70"/><text class="note" x="445" y="202">display</text><path class="flow" d="M435 97h55v70h70"/><text class="note" x="445" y="132">temperature metric</text><path class="flow" d="M720 167h80"/><text class="note" x="738" y="150">renders</text><text class="note" x="35" y="302">Purple dashed arrow: device dependency · Red arrow: live data or rendering</text></svg>
