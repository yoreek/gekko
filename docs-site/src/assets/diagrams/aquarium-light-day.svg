<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="918" height="378" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="35" y="42" font-size="19" font-weight="700" fill="#0f172a">A reef day in five channels</text>

  <!-- plot area: x 80..860 maps 00:00..24:00 (32.5 px/h), y 300 (0%) .. 90 (100%) -->
  <!-- night/day bands -->
  <rect x="80" y="80" width="780" height="220" fill="#eef2ff" opacity="0.6"/>
  <rect x="308" y="80" width="422" height="220" fill="#fef9c3" opacity="0.8"/>
  <text x="519" y="74" text-anchor="middle" font-size="13" fill="#a16207">☀ 07:00 – 20:00</text>
  <text x="180" y="74" text-anchor="middle" font-size="13" fill="#6366f1">☾ night</text>
  <text x="800" y="74" text-anchor="middle" font-size="13" fill="#6366f1">☾ night</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="860" y2="300" stroke="#94a3b8" stroke-width="3"/>
  <line x1="80" y1="300" x2="80" y2="80" stroke="#94a3b8" stroke-width="3"/>
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="80" y="322">00:00</text>
    <text x="275" y="322">06:00</text>
    <text x="470" y="322">12:00</text>
    <text x="665" y="322">18:00</text>
    <text x="860" y="322">24:00</text>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="end">
    <text x="72" y="95">100%</text>
    <text x="72" y="198">50%</text>
    <text x="72" y="303">0%</text>
  </g>

  <!-- Royal blue: 07:00 rise, 90% 09:30-19:00, off 20:30 -->
  <path d="M80 300 H 308 C 340 300 350 111 389 111 H 698 C 730 111 735 300 746 300 H 860"
        fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Blue: 07:30 rise, 75% 10:00-18:30, off 20:00 -->
  <path d="M80 300 H 324 C 356 300 366 142 405 142 H 682 C 710 142 715 300 730 300 H 860"
        fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- White: 08:30 rise, 80% 11:00-15:00, off 18:30 -->
  <path d="M80 300 H 356 C 390 300 400 130 438 130 H 568 C 610 130 615 300 682 300 H 860"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Violet: 07:00 rise, 45% plateau, off 20:30 -->
  <path d="M80 300 H 308 C 335 300 345 205 380 205 H 690 C 720 205 725 300 746 300 H 860"
        fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Moonlight: 8% at night, 0 during day -->
  <path d="M80 282 H 300 C 320 282 322 300 340 300 H 700 C 718 300 720 282 740 282 H 860"
        fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- legend -->
  <g font-size="13.5" fill="#334155">
    <g transform="translate(100,352)">
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#1d4ed8" stroke-width="4"/>
      <text x="34" y="0">Royal blue</text>
    </g>
    <g transform="translate(240,352)">
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#38bdf8" stroke-width="4"/>
      <text x="34" y="0">Blue</text>
    </g>
    <g transform="translate(340,352)">
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#f59e0b" stroke-width="4"/>
      <text x="34" y="0">White (warm)</text>
    </g>
    <g transform="translate(500,352)">
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#8b5cf6" stroke-width="4"/>
      <text x="34" y="0">Violet</text>
    </g>
    <g transform="translate(620,352)">
      <line x1="0" y1="-5" x2="26" y2="-5" stroke="#64748b" stroke-width="3" stroke-dasharray="7 5"/>
      <text x="34" y="0">Moonlight</text>
    </g>
  </g>
</svg>
