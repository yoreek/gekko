<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Placeholder температуры на дисплее SSD1306</title><desc id="desc">Placeholder температуры с одним знаком после запятой преобразуется в показание комнаты на OLED SSD1306.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.heading{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.note{font-size:13px}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:12}.oled{fill:#334155;stroke:#475569;stroke-width:3;rx:18}.screen{fill:#020617;stroke:#0f172a;stroke-width:2;rx:5}.arrow{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7c3aed"/></marker></defs><rect class="panel" x="30" y="70" width="350" height="175"/><text class="heading" x="55" y="105">Текстовый виджет</text><text class="label" x="55" y="138">Placeholder</text><rect x="55" y="152" width="300" height="52" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="mono" x="70" y="184">{{dev.&lt;sensor-id&gt;.temperature</text><text class="mono" x="70" y="202">| fixed:1}} °C</text><path class="arrow" d="M390 158h105"/><text class="note" x="405" y="138">живое значение</text><rect class="oled" x="530" y="35" width="300" height="250"/><rect class="screen" x="552" y="62" width="256" height="196" rx="5"/><text x="580" y="111" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#67e8f9">КОМНАТА</text><line x1="578" y1="126" x2="782" y2="126" stroke="#155e75" stroke-width="2"/><text x="578" y="186" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="45" fill="#67e8f9">24.6 °C</text><text x="578" y="225" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#22d3ee">Температура воды</text><text class="label" x="615" y="313">Предпросмотр OLED SSD1306</text></svg>
