<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="1" y="1" width="918" height="338" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="35" y="42" font-size="19" font-weight="700" fill="#0f172a">Controllo contenitore</text>

  <!-- Bottle 1: OK -->
  <g>
    <rect x="90" y="90" width="120" height="180" rx="10" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="126" y="66" width="48" height="24" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <rect x="96" y="126" width="108" height="138" rx="6" fill="#bef264" opacity="0.8"/>
    <!-- threshold line -->
    <line x1="84" y1="237" x2="216" y2="237" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5"/>
    <g transform="translate(150,108)">
      <circle r="0" fill="none"/>
    </g>
    <rect x="112" y="288" width="76" height="26" rx="13" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">OK</text>
  </g>

  <!-- Bottle 2: warning -->
  <g>
    <rect x="400" y="90" width="120" height="180" rx="10" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="436" y="66" width="48" height="24" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <rect x="406" y="242" width="108" height="22" rx="6" fill="#bef264" opacity="0.8"/>
    <line x1="394" y1="237" x2="526" y2="237" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="533" y="232" font-size="13" fill="#b45309">soglia di</text>
    <text x="533" y="249" font-size="13" fill="#b45309">avviso</text>
    <!-- bell -->
    <g transform="translate(460,44)">
      <path d="M0,-12 a 10 10 0 0 1 10 10 v 6 l 4 5 h -28 l 4 -5 v -6 a 10 10 0 0 1 10 -10 z" fill="#f59e0b"/>
      <circle cx="0" cy="12" r="3.4" fill="#f59e0b"/>
    </g>
    <rect x="408" y="288" width="104" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">Basso — avviso</text>
  </g>

  <!-- Bottle 3: empty -->
  <g>
    <rect x="700" y="90" width="120" height="180" rx="10" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <rect x="736" y="66" width="48" height="24" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <line x1="694" y1="237" x2="826" y2="237" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- crossed pump icon -->
    <g transform="translate(760,180)">
      <circle r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
      <circle r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-19" y1="-19" x2="19" y2="19" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    </g>
    <rect x="688" y="288" width="144" height="26" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="760" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Vuoto · stop</text>
  </g>

  <!-- captions between bottles -->
  <text x="255" y="150" font-size="14" fill="#475569">ogni dose è</text>
  <text x="255" y="169" font-size="14" fill="#475569">sottratta dal</text>
  <text x="255" y="188" font-size="14" fill="#475569">contatore</text>
  <path d="M255 205 h 60" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M315 198 l 14 7 -14 7 z" fill="#94a3b8"/>

  <text x="562" y="150" font-size="14" fill="#475569">sensore livello o</text>
  <text x="562" y="169" font-size="14" fill="#475569">contatore a 0</text>
  <text x="562" y="188" font-size="14" fill="#475569">rileva vuoto</text>
  <path d="M562 205 h 60" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M622 198 l 14 7 -14 7 z" fill="#94a3b8"/>

  <text x="460" y="332" text-anchor="middle" font-size="14" fill="#475569">dopo il riempimento, indicare il volume — contatore e avvisi si aggiornano</text>
</svg>
