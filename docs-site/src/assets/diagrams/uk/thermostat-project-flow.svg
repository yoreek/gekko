<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Проєкт термостата: підключення, залежності та потік керування</title><desc id="desc">Три панелі показують DS18B20 і реле на ESP32, граф залежностей Gekko та потік від температури до нагрівача.</desc><style>text{font-family:system-ui,sans-serif;fill:#1f2937}.t{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:600}.s{font-size:13px}.p{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}.n{fill:#fff;stroke:#475569;stroke-width:2;rx:9}.w{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}.f{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="context-stroke"/></marker></defs><rect class="p" x="20" y="45" width="280" height="420"/><text class="t" x="40" y="78">1. Підключення</text><rect class="n" x="100" y="125" width="120" height="58"/><text class="l" x="134" y="159">ESP32</text><rect class="n" x="55" y="275" width="105" height="55"/><text class="l" x="73" y="307">DS18B20</text><rect class="n" x="190" y="275" width="90" height="55"/><text class="l" x="211" y="307">Реле</text><rect class="n" x="182" y="370" width="105" height="55"/><text class="l" x="189" y="402">Нагрівач</text><path class="w" d="M130 183v62h-22v30"/><text class="s" x="43" y="243">DATA 1-Wire</text><path class="w" d="M190 183v62h45v30"/><text class="s" x="202" y="243">GPIO-вихід</text><path class="w" d="M235 330v40"/><text class="s" x="242" y="355">вмикає</text><rect class="p" x="340" y="45" width="280" height="420"/><text class="t" x="360" y="78">2. Граф пристроїв</text><rect class="n" x="395" y="120" width="170" height="50"/><text class="l" x="426" y="150">Шина 1-Wire</text><rect class="n" x="380" y="225" width="115" height="50"/><text class="l" x="397" y="255">DS18B20</text><rect class="n" x="510" y="225" width="85" height="50"/><text class="l" x="519" y="255">Вихід</text><rect class="n" x="430" y="350" width="105" height="50"/><text class="l" x="446" y="380">Термостат</text><path class="d" d="M455 170v55"/><text class="s" x="460" y="205">залежить</text><path class="d" d="M438 275v45h29v30"/><text class="s" x="365" y="312">датчик температури</text><path class="d" d="M552 275v45h-52v30"/><text class="s" x="506" y="312">вимикач</text><rect class="p" x="660" y="45" width="280" height="420"/><text class="t" x="680" y="78">3. Потік керування</text><rect class="n" x="718" y="125" width="160" height="48"/><text class="l" x="739" y="155">Температура</text><rect class="n" x="718" y="220" width="160" height="48"/><text class="l" x="746" y="250">Термостат</text><rect class="n" x="718" y="315" width="160" height="48"/><text class="l" x="741" y="345">Реле / нагрів</text><path class="f" d="M798 173v47"/><text class="s" x="810" y="200">значення</text><path class="f" d="M798 268v47"/><text class="s" x="810" y="295">Увімк. / Вимк.</text><text class="s" x="690" y="415">Суцільна стрілка: сигнал або команда</text><text class="s" x="690" y="438">Пунктир: залежність</text></svg>
