[env]
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
	bblanchon/StreamUtils @ ^1.8.0
	esp32async/ESPAsyncWebServer @ ^3.7.3
	esp32async/AsyncTCP @ ^3.4.10
; Optional local integration context; enabled in env:esp32dev_reefduino.
;	ReefDuino=file:///home/yura/Documents/PlatformIO/Projects/ReefDuino@1.39
; Optional domain libraries from the existing project profile. Keep runtime usage behind flags.
;	paulstoffregen/Time @ ^1.6.1
;	jchristensen/Timezone @ ^1.2.4
;	knolleary/PubSubClient @ ^2.8
;	milesburton/DallasTemperature @ ^3.9.1
;	paulstoffregen/OneWire @ ^2.3.6

build_flags =
	-DARDUINOJSON_ENABLE_STD_STRING=1
	-DDEBUG_LEVEL=Info
	-DDEBUG_SERIAL_DEVICE=Serial
	-DDEBUG_SERIAL_SPEED=921600
	-DWITH_ARDUINO_JSON
	-DWITH_DEBUG
	-DWITH_LITTLEFS
	-DWITH_WEB_SERVER
	-DWITH_WIFI_NETWORK_MANAGER_DEBUG
	-DWITH_APP_STATE_MANAGER_DEBUG
	-DWITH_PORTAL_SERVER_DEBUG
;	-DWITH_CONFIG_STORE_DEBUG
;	-DWITH_PROVISIONING_DEBUG
;	-DWITH_STATE_MACHINE_DEBUG
	-DWITH_ARDUINO_OTA
	-DWITH_WEB_OTA_DISABLED_BY_DEFAULT
	-Isrc
	-std=c++17
	-std=gnu++17
	-Wno-attributes

build_unflags =
	-std=gnu++11
	-std=c++11

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.partitions = my_partitions.csv
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder
platform_packages =
	toolchain-xtensa-esp32@12.2.0+20230208

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.240

[env:esp32dev_reefduino]
extends = env:esp32dev
lib_deps =
	${env.lib_deps}
	ReefDuino=file:///home/yura/Documents/PlatformIO/Projects/ReefDuino@1.39

[env:esp32dev_web_ota]
extends = env:esp32dev
build_flags =
	${env.build_flags}
	-DWITH_WEB_OTA

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
build_flags =
	-DUNIT_TEST
	-DARDUINOJSON_ENABLE_STD_STRING=1
	-std=c++17
	-Wall
	-Wextra
	-Isrc
build_unflags =
	-std=gnu++11
	-std=c++11
