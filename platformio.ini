[env]
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
	bblanchon/StreamUtils @ ^1.8.0
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/Adafruit NeoPixel @ ^1.15.2
	esp32async/ESPAsyncWebServer @ ^3.7.3
	esp32async/AsyncTCP @ ^3.4.10
; Optional domain libraries from the existing project profile. Keep runtime usage behind flags.
	paulstoffregen/Time @ ^1.6.1
	jchristensen/Timezone @ ^1.2.4
	knolleary/PubSubClient @ ^2.8
;	milesburton/DallasTemperature @ ^3.9.1
	paulstoffregen/OneWire @ ^2.3.6

; BLE provisioning is OFF by default (no flag, libraries ignored). Only the
; `_ble` variant of each chip below turns it on by adding the flag back and
; un-ignoring these libraries -- nothing here needs to be un-declared later.
lib_ignore =
	WiFiProv
	SimpleBLE

build_flags =
	-DARDUINOJSON_ENABLE_STD_STRING=1
	-DWITH_DEBUG
	-DWITH_ARDUINO_JSON
	-DWITH_LITTLEFS
	-DWITH_WEB_SERVER
	-DWITH_CONFIG_STORE_DEBUG
	-DWITH_DEVICE_REGISTRY_DEBUG
;	-DWITH_DS18B20_TEMPERATURE_SENSOR_DEBUG
;	-DWITH_STATE_MACHINE_DEBUG
;	-DWITH_NTP_MANAGER_DEBUG
;	-DWITH_RTC_SYNC_DEBUG
	-DWITH_SYSTEM_RESTART_API
	-DWITH_HOME_ASSISTANT
	-DWITH_MQTT_DEBUG
	-Isrc
	-std=c++17
	-std=gnu++17
	-Wno-attributes

check_tool = cppcheck, clangtidy
check_skip_packages = yes
extra_scripts = pre:scripts/generate_version_header.py

build_unflags =
	-std=gnu++11
	-std=c++11

; Recommended install target: no BLE provisioning, no BLE GPIO reservation, no Bluetooth
; provisioning code compiled in. This is the primary firmware build and verification target.
; All classic-ESP32 platform/board/toolchain settings are declared once here; every other
; classic-ESP32 env (esp32dev_ble, esp32dev_ota) extends this one.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
; Legacy *ConfigV<n> structs are [[deprecated]] (see ConfigCodec.h); any active use in our
; own runtime/adapter code is a hard error. Scoped to src/ so third-party library
; deprecations are unaffected. Migration/decode opts out via EWFM_LEGACY_CONFIG_USE_*.
build_src_flags = -Werror=deprecated-declarations
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.partitions = my_partitions.csv
board_build.filesystem = littlefs
framework = arduino
; Keep monitor/debug serial at 115200 because ESP32 ROM boot and panic output
; use 115200 before the firmware logger starts. Upload can stay faster.
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
platform_packages =
	toolchain-xtensa-esp32@12.2.0+20230208
check_flags =
	cppcheck: --cppcheck-build-dir=.pio/cppcheck-cache/esp32dev --enable=warning,performance,portability --inline-suppr --language=c++ --std=c++17 --suppress=missingIncludeSystem --template=gcc
	clangtidy: --config-file=.clang-tidy

; BLE WiFi provisioning variant. Not the recommended install target - BLE costs meaningful
; flash/RAM that most users don't need; env:esp32dev is the one to install by default.
[env:esp32dev_ble]
extends = env:esp32dev
lib_ignore =
build_flags =
	${env:esp32dev.build_flags}
	-DWITH_BLE_PROVISIONING
	-DBLE_PROVISIONING_BUTTON_PIN=32
check_flags =
	cppcheck: --cppcheck-build-dir=.pio/cppcheck-cache/esp32dev_ble --enable=warning,performance,portability --inline-suppr --language=c++ --std=c++17 --suppress=missingIncludeSystem --template=gcc
	clangtidy: --config-file=.clang-tidy

; Upload-only alias for OTA delivery.
; Build flags, binary contents, and runtime features are identical to env:esp32dev.
; The only difference is the upload transport and target IP.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.240

; ESP32-S3. Same official platform/core (2.x) as esp32dev -- just its own toolchain
; and the board's own flash-mode/speed defaults (esp32dev's inherited 40 MHz
; classic-ESP32 override makes the bootloader packaging step look for a
; bootloader_qio_40m.elf that doesn't ship for S3).
[env:esp32s3]
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_flash = 80000000L
board_build.flash_mode = qio
platform_packages =
	toolchain-xtensa-esp32s3@12.2.0+20230208

[env:esp32s3_ble]
extends = env:esp32s3
lib_ignore =
build_flags =
	${env:esp32s3.build_flags}
	-DWITH_BLE_PROVISIONING
	-DBLE_PROVISIONING_BUTTON_PIN=32

; ESP32-C3 (RISC-V). `-march` is required: GCC 12.2's default RISC-V ISA baseline
; doesn't imply Zicsr/Zifencei the way the framework headers assume, otherwise
; assembler errors like `csrr ... extension zicsr required`.
[env:esp32c3]
extends = env:esp32dev
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
platform_packages =
	toolchain-riscv32-esp@12.2.0+20230208
build_flags =
	${env:esp32dev.build_flags}
	-march=rv32imc_zicsr_zifencei

[env:esp32c3_ble]
extends = env:esp32c3
lib_ignore =
build_flags =
	${env:esp32c3.build_flags}
	-DWITH_BLE_PROVISIONING
	-DBLE_PROVISIONING_BUTTON_PIN=32

; ESP32-S2. No BLE variant: the S2 has no Bluetooth/BLE radio at all (WiFi-only chip),
; so `-DWITH_BLE_PROVISIONING` cannot link (undefined reference to wifi_prov_scheme_ble)
; -- confirmed by an actual build attempt, not a paper assumption.
[env:esp32s2]
extends = env:esp32dev
board = esp32-s2-saola-1
board_build.mcu = esp32s2
platform_packages =
	toolchain-xtensa-esp32s2@12.2.0+20230208

; ESP32-C6. Needs Arduino-ESP32 core 3.x (adcAttachPin/ledcSetup/ledcAttachPin/
; ledcWrite/ledcDetachPin were all replaced -- see the ESP_ARDUINO_VERSION_MAJOR
; branches in ArduinoAdcInputDriver.cpp/LedcAnalogOutputDevice.cpp), which the
; official `platformio/espressif32` platform does not ship at any released
; version (its board manifests only declare `espidf`, never `arduino`, for any
; C6 board). Use the community `pioarduino` fork instead, which repackages the
; real Espressif Arduino-ESP32 3.x release. See docs/esp32-board-models.md for
; the full investigation.
;
; The registry release of OneWire (2.3.8, same as ${env.lib_deps} pulls for every
; other env) doesn't handle ESP32-C6's typed GPIO register structs -- direct register
; access (GPIO.out_w1tc = ...) fails to compile because C6 needs the same `.val`
; access C3 already gets. Fixed upstream on the project's default branch
; (PaulStoffregen/OneWire, "Add support for ESP32-C6") but not yet in a tagged
; release; track the branch for this env only until a 2.3.9+ release picks it up.
;
; No BLE variant: linking `-DWITH_BLE_PROVISIONING` on this pioarduino/core-3.x release
; fails with duplicate protobuf symbols between libespressif__network_provisioning.a and
; libwifi_provisioning.a (a framework packaging conflict, not something fixable in our
; own source) -- confirmed by an actual build attempt.
[env:esp32c6]
extends = env:esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.partitions = my_partitions.csv
board_build.filesystem = littlefs
platform_packages =
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
	bblanchon/StreamUtils @ ^1.8.0
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/Adafruit NeoPixel @ ^1.15.2
	esp32async/ESPAsyncWebServer @ ^3.7.3
	esp32async/AsyncTCP @ ^3.4.10
	paulstoffregen/Time @ ^1.6.1
	jchristensen/Timezone @ ^1.2.4
	knolleary/PubSubClient @ ^2.8
	https://github.com/PaulStoffregen/OneWire.git#master

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
lib_ignore =
check_flags =
	cppcheck: --cppcheck-build-dir=.pio/cppcheck-cache/native --enable=warning,performance,portability --inline-suppr --language=c++ --std=c++17 --suppress=missingIncludeSystem --template=gcc
	clangtidy: --config-file=.clang-tidy
build_flags =
	-DUNIT_TEST
	-DWITH_BLE_PROVISIONING
	-DBLE_PROVISIONING_BUTTON_PIN=32
	-DARDUINOJSON_ENABLE_STD_STRING=1
	-std=c++17
	-Wall
	-Wextra
	-Isrc
	-Itest/fakes
build_unflags =
	-std=gnu++11
	-std=c++11
