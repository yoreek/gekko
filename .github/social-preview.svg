<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Gekko modular ESP32 device controller</title>
  <desc id="description">Gekko logo, project description, and a preview of the built-in web dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12233c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="190" cy="50" r="360" fill="url(#glow)"/>
  <path d="M0 566 C 250 520, 410 650, 690 582 S 1050 535, 1280 600 V640 H0Z" fill="#22c55e" opacity="0.08"/>

  <text x="70" y="270" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="750" letter-spacing="-2">Gekko</text>
  <text x="70" y="326" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500">Modular ESP32 device controller</text>
  <text x="70" y="370" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Configure devices and automation</text>
  <text x="70" y="400" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">directly in your browser.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">
    <rect x="70" y="438" width="174" height="46" rx="23" fill="#166534"/>
    <text x="157" y="467" fill="#dcfce7" text-anchor="middle">33 device types</text>
    <rect x="258" y="438" width="212" height="46" rx="23" fill="#1e3a5f"/>
    <text x="364" y="467" fill="#dbeafe" text-anchor="middle">No project rebuilds</text>
  </g>

  <text x="70" y="548" fill="#4ade80" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="650">yoreek.github.io/gekko</text>

  <g filter="url(#shadow)">
    <rect x="584" y="88" width="662" height="426" rx="26" fill="#e2e8f0" opacity="0.16"/>
    <rect x="592" y="96" width="646" height="410" rx="22" fill="#f8fafc"/>
  </g>
</svg>
