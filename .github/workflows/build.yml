name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + clang-format
        run: |
          pip install -U platformio
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Prepare PlatformIO home dirs
        run: mkdir -p ~/.platformio/packages ~/.platformio/platforms

      - name: Lint + native unit tests
        run: scripts/test.sh

  ble-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Prepare PlatformIO home dirs
        run: mkdir -p ~/.platformio/packages ~/.platformio/platforms

      - name: Build firmware bundle with BLE provisioning
        run: |
          pio run -e esp32dev_ble
          mkdir -p .pio/ble-staging
          cp .pio/build/esp32dev_ble/bootloader.bin \
             .pio/build/esp32dev_ble/partitions.bin \
             .pio/build/esp32dev_ble/firmware.bin \
             .pio/ble-staging/
          pio run -e esp32dev_ble -t buildfs
          cp .pio/build/esp32dev_ble/littlefs.bin .pio/ble-staging/
          mkdir -p .pio/ble-distribution/ble
          python3 scripts/collect_webflash.py \
            --build-dir .pio/ble-staging \
            --output-dir .pio/ble-distribution/ble \
            --partitions my_partitions.csv
          cp webflash/flash.sh webflash/flash.bat webflash/flash.py \
            .pio/ble-distribution/

      - name: Upload BLE firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: gekko-esp32-ble-${{ github.sha }}
          path: .pio/ble-distribution
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ble-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download BLE firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: gekko-esp32-ble-${{ github.sha }}
          path: .pio/release/ble-source

      - name: Package release firmware
        shell: bash
        run: |
          set -euo pipefail
          release_root=".pio/release"
          default_name="gekko-esp32-${GITHUB_REF_NAME}"
          ble_name="gekko-esp32-ble-${GITHUB_REF_NAME}"

          mkdir -p "${release_root}/${default_name}"
          cp webflash/bootloader.bin \
             webflash/partitions.bin \
             webflash/firmware.bin \
             webflash/littlefs.bin \
             webflash/merged-firmware.bin \
             webflash/manifest.json \
             webflash/flash-layout.env \
             webflash/flash.sh \
             webflash/flash.bat \
             webflash/flash.py \
             "${release_root}/${default_name}/"

          mkdir -p "${release_root}/${ble_name}"
          cp -R "${release_root}/ble-source/." \
                "${release_root}/${ble_name}/"

          cd "${release_root}"
          zip -qr "${default_name}.zip" "${default_name}"
          zip -qr "${ble_name}.zip" "${ble_name}"
          sha256sum "${default_name}.zip" "${ble_name}.zip" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          default_zip=".pio/release/gekko-esp32-${GITHUB_REF_NAME}.zip"
          ble_zip=".pio/release/gekko-esp32-ble-${GITHUB_REF_NAME}.zip"
          checksums=".pio/release/SHA256SUMS"

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${default_zip}" "${ble_zip}" "${checksums}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${default_zip}" "${ble_zip}" "${checksums}" \
              --verify-tag \
              --generate-notes \
              --title "Gekko ${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
