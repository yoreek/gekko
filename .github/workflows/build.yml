name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + clang-format
        run: |
          pip install -U platformio
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Prepare PlatformIO home dirs
        run: mkdir -p ~/.platformio/packages ~/.platformio/platforms

      - name: Lint + native unit tests
        run: scripts/test.sh

  build-firmware:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev

      - name: Build filesystem image (littlefs)
        run: pio run -e esp32dev -t buildfs

      - name: Collect flashable binaries
        run: |
          mkdir -p artifacts
          cp .pio/build/esp32dev/bootloader.bin artifacts/
          cp .pio/build/esp32dev/partitions.bin artifacts/
          cp .pio/build/esp32dev/firmware.bin artifacts/
          cp .pio/build/esp32dev/littlefs.bin artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: artifacts/
          retention-days: 30
