name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'webflash/**'
      - 'src/**'
      - 'portal-spa/**'
      - 'platformio.ini'
      - 'my_partitions.csv'
      - 'scripts/collect_webflash.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + clang-format
        run: |
          pip install -U platformio
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: docs-site
        run: pnpm build

      - name: Install portal SPA dependencies
        working-directory: portal-spa
        run: pnpm install --frozen-lockfile

      - name: Build portal SPA -> data/ (LittleFS assets)
        working-directory: portal-spa
        run: pnpm deploy:data

      - name: Bundle web flasher (every chip, default + BLE)
        run: |
          set -euo pipefail
          mkdir -p docs-site/dist/install/ble

          build_chip() {
            env_name="$1"
            chip="$2"
            out_dir="$3"
            python3 tools/devicegen/generate_boards.py generate --chip "$chip"
            pio run -e "$env_name"
            pio run -e "$env_name" -t buildfs
            python3 scripts/collect_webflash.py \
              --build-dir ".pio/build/$env_name" \
              --output-dir "$out_dir/$chip" \
              --partitions my_partitions.csv \
              --chip "$chip"
          }

          build_chip esp32dev esp32 docs-site/dist/install
          build_chip esp32s2 esp32s2 docs-site/dist/install
          build_chip esp32s3 esp32s3 docs-site/dist/install
          build_chip esp32c3 esp32c3 docs-site/dist/install
          build_chip esp32c6 esp32c6 docs-site/dist/install
          python3 scripts/merge_webflash_manifests.py \
            --output-dir docs-site/dist/install \
            --chips esp32 esp32s2 esp32s3 esp32c3 esp32c6
          cp webflash/index.html webflash/flash.sh webflash/flash.bat webflash/flash.py \
             docs-site/dist/install/

          build_chip esp32dev_ble esp32 docs-site/dist/install/ble
          build_chip esp32s3_ble esp32s3 docs-site/dist/install/ble
          build_chip esp32c3_ble esp32c3 docs-site/dist/install/ble
          python3 scripts/merge_webflash_manifests.py \
            --output-dir docs-site/dist/install/ble \
            --chips esp32 esp32s3 esp32c3

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
