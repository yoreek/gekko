name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'webflash/**'
      - 'src/**'
      - 'data/**'
      - 'platformio.ini'
      - 'my_partitions.csv'
      - 'scripts/collect_webflash.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: docs-site
        run: pnpm build

      - name: Bundle web flasher
        run: |
          mkdir -p docs-site/dist/install
          cp webflash/index.html webflash/manifest.json webflash/*.bin \
             webflash/flash.sh webflash/flash.bat webflash/flash.py \
             docs-site/dist/install/

      - name: Bundle web flasher without BLE provisioning
        run: |
          pio run -e esp32dev_no_ble
          mkdir -p .pio/no-ble-staging
          cp .pio/build/esp32dev_no_ble/bootloader.bin \
             .pio/build/esp32dev_no_ble/partitions.bin \
             .pio/build/esp32dev_no_ble/firmware.bin \
             .pio/no-ble-staging/
          pio run -e esp32dev_no_ble -t buildfs
          cp .pio/build/esp32dev_no_ble/littlefs.bin .pio/no-ble-staging/
          python3 scripts/collect_webflash.py \
            --build-dir .pio/no-ble-staging \
            --output-dir docs-site/dist/install/no-ble \
            --partitions my_partitions.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
