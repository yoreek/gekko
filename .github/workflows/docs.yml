name: Docs

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run carries the id/sha of the Test run whose artifacts we want.
      # workflow_dispatch (manual redeploy) has neither, so look up the latest
      # successful Test run on master instead.
      - name: Resolve source Test run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              core.setOutput('run_id', context.payload.workflow_run.id);
              core.setOutput('head_sha', context.payload.workflow_run.head_sha);
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              branch: 'master',
              status: 'success',
              per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.setFailed('No successful Test run found on master');
              return;
            }
            core.setOutput('run_id', run.id);
            core.setOutput('head_sha', run.head_sha);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: docs-site
        run: pnpm build

      # Test's `webflash` job already built and merged these bundles (every chip,
      # default + BLE) for this exact commit -- reuse them instead of recompiling
      # every chip firmware a second time just to publish the same binaries.
      - name: Download default webflash bundle
        uses: actions/download-artifact@v4
        with:
          name: gekko-webflash-default-${{ steps.source.outputs.head_sha }}
          path: docs-site/dist/install
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download BLE webflash bundle
        uses: actions/download-artifact@v4
        with:
          name: gekko-webflash-ble-${{ steps.source.outputs.head_sha }}
          path: docs-site/dist/install/ble
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
