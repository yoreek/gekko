# ESP32-S3 (Xtensa LX7, dual-core, native USB). LilyGO T-Display-S3, built-in
# 1.9" LCD. Most of the chip's GPIO are consumed by the display interface, so
# only 13 are broken out. See docs/esp32-board-models.md.
chip: esp32s3
boardId: lilygo-t-display-s3
label: "LilyGO T-Display-S3 (built-in LCD)"

pins:
  - { gpio: 1,  roles: [output, input, adc1] }
  - { gpio: 2,  roles: [output, input, adc1] }
  - { gpio: 3,  roles: [output, input, adc1, strapping] }
  - { gpio: 10, roles: [output, input, adc1] }
  - { gpio: 11, roles: [output, input, adc2] }
  - { gpio: 12, roles: [output, input, adc2] }
  - { gpio: 13, roles: [output, input, adc2] }
  - { gpio: 14, roles: [output, input, adc2] }
  - { gpio: 15, roles: [output, input, adc2], note: "peripheral-power-enable pin -- must be driven HIGH at boot or the LCD/other onboard peripherals stay unpowered; effectively mandatory, not general-purpose despite being exposed" }
  - { gpio: 16, roles: [output, input, adc2] }
  - { gpio: 17, roles: [output, input, adc2] }
  - { gpio: 18, roles: [output, input, adc2] }
  - { gpio: 21, roles: [output, input] }
  - { gpio: 43, roles: [output, input], note: "U0 UART TX" }
  - { gpio: 44, roles: [output, input], note: "U0 UART RX" }
  # The remaining chip GPIO are consumed internally by the onboard display
  # interface and not exposed as general-purpose pins on this board.

# Physical top-to-bottom header order, read directly off the espboards.dev pinout
# diagram image -- the text version was missing three unpopulated (NC) header
# positions present in the real image.
layout:
  left:  ["3V3", 1, 2, 3, 10, 11, 12, 13, NC, NC, GND, "5V"]
  right: [GND, GND, 43, 44, 18, 17, 21, 16, NC, GND, GND, "3V3"]
