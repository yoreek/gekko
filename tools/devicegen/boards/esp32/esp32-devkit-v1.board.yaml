# Classic ESP32 (Xtensa LX6). See docs/esp32-board-models.md for the research
# this is derived from. Roles vocabulary (closed, same across all chips):
# output, input, adc1, adc2, strapping, reservedFlash.
chip: esp32
boardId: esp32-devkit-v1
label: "ESP32 DevKit V1 (DOIT, 30-pin)"

pins:
  - { gpio: 0,  roles: [output, input, adc2, strapping] }
  - { gpio: 1,  roles: [output, input] }
  - { gpio: 2,  roles: [output, input, adc2, strapping] }
  - { gpio: 3,  roles: [output, input] }
  - { gpio: 4,  roles: [output, input, adc2] }
  - { gpio: 5,  roles: [output, input, strapping] }
  - { gpio: 12, roles: [output, input, adc2, strapping] }
  - { gpio: 13, roles: [output, input, adc2] }
  - { gpio: 14, roles: [output, input, adc2] }
  - { gpio: 15, roles: [output, input, adc2, strapping] }
  - { gpio: 16, roles: [output, input] }
  - { gpio: 17, roles: [output, input] }
  - { gpio: 18, roles: [output, input], fixedDefaultFor: spiSck }
  - { gpio: 19, roles: [output, input] }
  - { gpio: 21, roles: [output, input], fixedDefaultFor: i2cSda }
  - { gpio: 22, roles: [output, input], fixedDefaultFor: i2cScl }
  - { gpio: 23, roles: [output, input], fixedDefaultFor: spiMosi }
  - { gpio: 25, roles: [output, input, adc2] }
  - { gpio: 26, roles: [output, input, adc2] }
  - { gpio: 27, roles: [output, input, adc2] }
  - { gpio: 32, roles: [output, input, adc1] }
  - { gpio: 33, roles: [output, input, adc1] }
  - { gpio: 34, roles: [input, adc1] }
  - { gpio: 35, roles: [input, adc1] }
  - { gpio: 36, roles: [input, adc1] }
  - { gpio: 39, roles: [input, adc1] }
  # GPIO6-11 (internal flash) and GPIO37/38 are not physically broken out on
  # this 30-pin header at all -- omitted rather than listed as reservedFlash.

# Physical top-to-bottom header order. Source: espboards.dev/esp32/esp32doit-devkit-v1/
# GPIO0 omitted here (present in `pins` above, but its exact header position wasn't
# confirmed by that source -- it's usually tied to the BOOT button on this board).
layout:
  left:  [EN, GND, "5V", GND, "3V3", 1, 2, 3, 4, 5, 12, 13, 14, 15, 16]
  right: [17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33, 34, 35, 36, 39]
