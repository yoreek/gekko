# Classic ESP32 (Xtensa LX6), 38-pin header -- wider than DevKit V1, same
# module/chip. See docs/esp32-board-models.md.
chip: esp32
boardId: nodemcu-32s
label: "NodeMCU-32S / generic ESP-WROOM-32 (38-pin)"
isDefault: true

pins:
  - { gpio: 0,  roles: [output, input, adc2, strapping] }
  - { gpio: 1,  roles: [output, input] }
  - { gpio: 2,  roles: [output, input, adc2, strapping] }
  - { gpio: 3,  roles: [output, input] }
  - { gpio: 4,  roles: [output, input, adc2] }
  - { gpio: 5,  roles: [output, input, strapping] }
  - { gpio: 6,  roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 7,  roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 8,  roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 9,  roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 10, roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 11, roles: [reservedFlash], note: "physically present on this wider header but wired to internal SPI flash -- do not use" }
  - { gpio: 12, roles: [output, input, adc2, strapping] }
  - { gpio: 13, roles: [output, input, adc2] }
  - { gpio: 14, roles: [output, input, adc2] }
  - { gpio: 15, roles: [output, input, adc2, strapping] }
  - { gpio: 16, roles: [output, input] }
  - { gpio: 17, roles: [output, input] }
  - { gpio: 18, roles: [output, input], fixedDefaultFor: spiSck }
  - { gpio: 19, roles: [output, input] }
  - { gpio: 21, roles: [output, input], fixedDefaultFor: i2cSda }
  - { gpio: 22, roles: [output, input], fixedDefaultFor: i2cScl }
  - { gpio: 23, roles: [output, input], fixedDefaultFor: spiMosi }
  - { gpio: 25, roles: [output, input, adc2] }
  - { gpio: 26, roles: [output, input, adc2] }
  - { gpio: 27, roles: [output, input, adc2] }
  - { gpio: 32, roles: [output, input, adc1] }
  - { gpio: 33, roles: [output, input, adc1] }
  - { gpio: 34, roles: [input, adc1] }
  - { gpio: 35, roles: [input, adc1] }
  - { gpio: 36, roles: [input, adc1] }
  - { gpio: 39, roles: [input, adc1] }

# Physical top-to-bottom header order. Source: user-confirmed 38-pin ESP32-DevKitC
# table (right column read bottom-to-top of the printed numbering, since the header
# wraps around the bottom of the board near the USB connector).
layout:
  left:  ["3V3", EN, 36, 39, 34, 35, 32, 33, 25, 26, 27, 14, 12, GND, 13, 9, 10, 11, "5V"]
  right: [GND, 23, 22, 1, 3, 21, GND, 19, 18, 5, 17, 16, 4, 0, 2, 15, 8, 7, 6]
