# ESP32-C6 (RISC-V, single-core, WiFi 6 + Thread/Zigbee 802.15.4 + BLE 5).
# Official Espressif dev board; two USB-C ports (one plain USB-UART, one
# native USB-Serial/JTAG). See docs/esp32-board-models.md.
chip: esp32c6
boardId: esp32-c6-devkitc-1
label: "Espressif ESP32-C6-DevKitC-1"
isDefault: true

pins:
  - { gpio: 0,  roles: [output, input, adc1] }
  - { gpio: 1,  roles: [output, input, adc1] }
  - { gpio: 2,  roles: [output, input, adc1] }
  - { gpio: 3,  roles: [output, input, adc1] }
  - { gpio: 4,  roles: [output, input, adc1, strapping] }
  - { gpio: 5,  roles: [output, input, adc1, strapping] }
  - { gpio: 6,  roles: [output, input, adc1] }
  - { gpio: 7,  roles: [output, input] }
  - { gpio: 8,  roles: [output, input, strapping], note: "onboard addressable RGB LED (WS2812) -- shared with a strapping role, flag before reassigning" }
  - { gpio: 9,  roles: [output, input, strapping] }
  - { gpio: 10, roles: [output, input] }
  - { gpio: 11, roles: [output, input] }
  - { gpio: 12, roles: [output, input], note: "native USB D- -- avoid reassigning if the native USB port is used" }
  - { gpio: 13, roles: [output, input], note: "native USB D+ -- avoid reassigning if the native USB port is used" }
  - { gpio: 15, roles: [output, input, strapping] }
  - { gpio: 16, roles: [output, input], note: "U0 UART TX on this board's silkscreen" }
  - { gpio: 17, roles: [output, input], note: "U0 UART RX on this board's silkscreen" }
  - { gpio: 18, roles: [output, input] }
  - { gpio: 19, roles: [output, input] }
  - { gpio: 20, roles: [output, input] }
  - { gpio: 21, roles: [output, input] }
  - { gpio: 22, roles: [output, input] }
  - { gpio: 23, roles: [output, input] }

# Physical top-to-bottom header order, cross-checked against Espressif's own official
# pinout diagram -- one correction from the espboards.dev text version: the board
# silkscreen says RST, not EN.
layout:
  left:  ["3V3", RST, 4, 5, 6, 7, 0, 1, 8, 10, 11, 2, 3, "5V", GND, NC]
  right: [GND, 16, 17, 15, 23, 22, 21, 20, 19, 18, 9, GND, 13, 12, GND, NC]
