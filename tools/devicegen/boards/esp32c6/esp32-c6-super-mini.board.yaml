# ESP32-C6 (RISC-V, single-core, WiFi 6 + Thread/Zigbee 802.15.4 + BLE 5).
# Cheapest (~$5) way to get Zigbee 3.0/Thread/Matter-over-Thread; same "Super
# Mini" niche as the C3 version, same chip facts as the DevKitC-1. See
# docs/esp32-board-models.md.
chip: esp32c6
boardId: esp32-c6-super-mini
label: "ESP32-C6 Super Mini"

pins:
  - { gpio: 0,  roles: [output, input, adc1] }
  - { gpio: 1,  roles: [output, input, adc1] }
  - { gpio: 2,  roles: [output, input, adc1] }
  - { gpio: 3,  roles: [output, input, adc1] }
  - { gpio: 4,  roles: [output, input, adc1, strapping] }
  - { gpio: 5,  roles: [output, input, adc1, strapping] }
  - { gpio: 6,  roles: [output, input, adc1] }
  - { gpio: 7,  roles: [output, input] }
  - { gpio: 8,  roles: [output, input, strapping], note: "onboard addressable RGB LED (WS2812)" }
  - { gpio: 9,  roles: [output, input, strapping] }
  - { gpio: 10, roles: [output, input] }
  - { gpio: 11, roles: [output, input] }
  - { gpio: 12, roles: [output, input], note: "native USB D- -- avoid reassigning if the native USB port is used" }
  - { gpio: 13, roles: [output, input], note: "native USB D+ -- avoid reassigning if the native USB port is used" }
  - { gpio: 14, roles: [output, input] }
  - { gpio: 15, roles: [output, input, strapping] }
  - { gpio: 18, roles: [output, input] }
  - { gpio: 19, roles: [output, input] }
  - { gpio: 20, roles: [output, input] }
  - { gpio: 21, roles: [output, input] }
  - { gpio: 22, roles: [output, input], note: "U0 UART TX" }
  - { gpio: 23, roles: [output, input], note: "U0 UART RX" }

# No layout: section -- the espboards.dev pinout diagram image for this board is
# internally inconsistent (GP8 appears as a distinct row in both the left and right
# pin lists, and GP23/GP22/GP21/GP12/GP13 are drawn with diagonal leader lines to
# pins that don't sit in either straight column), so no left/right order could be
# read off it with confidence. Leaving absent rather than guessing.
