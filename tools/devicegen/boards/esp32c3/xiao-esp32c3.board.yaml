# ESP32-C3 (RISC-V, single-core). Seeed Studio XIAO ESP32-C3, same
# thumb-sized form factor as the XIAO S3, 44uA deep-sleep current -- popular
# for battery projects. See docs/esp32-board-models.md.
chip: esp32c3
boardId: xiao-esp32c3
label: "Seeed Studio XIAO ESP32-C3"

pins:
  - { gpio: 2,  roles: [output, input, adc1] }
  - { gpio: 3,  roles: [output, input, adc1] }
  - { gpio: 4,  roles: [output, input, adc1] }
  - { gpio: 5,  roles: [output, input, adc2], note: "ADC2-shared with WiFi/BLE radio -- unreliable for analog reads while the radio is active, same caveat as classic ESP32's ADC2" }
  - { gpio: 6,  roles: [output, input] }
  - { gpio: 7,  roles: [output, input] }
  - { gpio: 8,  roles: [output, input] }
  - { gpio: 9,  roles: [output, input], note: "physical BOOT button" }
  - { gpio: 10, roles: [output, input] }
  - { gpio: 20, roles: [output, input], note: "U0 UART RX" }
  - { gpio: 21, roles: [output, input], note: "U0 UART TX" }
  # Only 11 GPIO exposed on the 14-pin header; only 3 (GPIO2-4, A0-A2) are
  # genuinely reliable ADC1 channels.

# Physical top-to-bottom header order. Source: espboards.dev/esp32/xiao-esp32c3/
layout:
  left:  [2, 3, 4, 5, 6, 7, 21]
  right: ["5V", GND, "3V3", 10, 9, 8, 20]
