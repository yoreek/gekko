<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gekko — Flash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module"
  ></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 4rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    esp-web-install-button {
      display: block;
      margin-top: 1.5rem;
    }
    .note {
      color: #666;
      font-size: 0.9rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>Gekko</h1>
  <p>Connect the ESP32 to your computer via USB and click the button below.</p>

  <esp-web-install-button manifest="manifest.json">
    <button slot="activate">Flash device</button>
    <span slot="unsupported">Your browser doesn't support Web Serial. Open this page in Chrome or Edge.</span>
    <span slot="not-allowed">This page must be served over HTTPS or localhost.</span>
  </esp-web-install-button>

  <p class="note">Local test build (webflash/). Requires Chrome, Edge, or Opera on desktop.</p>
</body>
</html>
